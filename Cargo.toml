[package]
name = "powers"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
indoc = "2.0.7"
serde_json = "1.0"
